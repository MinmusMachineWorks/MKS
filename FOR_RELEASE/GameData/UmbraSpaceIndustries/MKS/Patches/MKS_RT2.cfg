// Every MKS and WOLF part that can act as a control source gets a RemoteTech signal
// processor, so an uncrewed module needs a connection like any probe core. Without
// ModuleSPU, RemoteTech treats the part as locally controlled and skips the network.
@PART[MKS_*|Tundra_*|Ranger_*|Duna_*|Atlas_*|WOLF_*|SalamanderPod]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleSPU]]:FOR[KolonyTools]:NEEDS[RemoteTech] {
	MODULE
	{
		name = ModuleSPU
	}
	
	MODULE
	{
		name = ModuleRTAntennaPassive
		TechRequired = unmannedTech
		OmniRange = 3000
		
		TRANSMITTER
		{
			PacketInterval = 0.3
			PacketSize = 2
			PacketResourceCost = 15.0
		}
	}
}

@PART[Ranger_CommPak]:AFTER[KolonyTools]:NEEDS[RemoteTech]
{
	!MODULE[ModuleDataTransmitter] {}
	@MODULE[ModuleAnimateGeneric]
	{
		%allowManualControl = false
	}
	%MODULE[ModuleRTAntenna] 
	{
		%Mode0OmniRange = 0
		%Mode1OmniRange = 2500000
		%MaxQ = 6000
		%EnergyCost = 0.13
		
		%DeployFxModules = 1
		
		%TRANSMITTER 
		{
			%PacketInterval = 0.3
			%PacketSize = 2
			%PacketResourceCost = 15.0
		}
	}
	
	%MODULE[ModuleSPUPassive] {}
}	
